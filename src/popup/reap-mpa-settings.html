<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Configurações do REAP MPA</title>
  <style>
    :root {
      --color-page: #eef3f5;
      --color-surface: #ffffff;
      --color-border: #d8e1e6;
      --color-text: #1f2937;
      --color-muted: #667085;
      --color-accent: #0f766e;
      --color-accent-soft: rgba(15, 118, 110, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, #f5f8fa 0%, #edf3f5 100%);
      color: var(--color-text);
    }

    .page-shell {
      min-height: 100vh;
      padding: 28px;
    }

    .page-card {
      max-width: 1080px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--color-border);
      border-radius: 22px;
      box-shadow: 0 18px 48px rgba(15, 23, 42, 0.08);
      padding: 24px;
      backdrop-filter: blur(8px);
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    .page-eyebrow {
      display: inline-flex;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--color-accent-soft);
      color: var(--color-accent);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .page-header h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.1;
    }

    .page-header p {
      margin: 0;
      color: var(--color-muted);
      max-width: 720px;
      line-height: 1.55;
      font-size: 14px;
    }

    .back-link {
      border: 1px solid var(--color-border);
      background: white;
      border-radius: 12px;
      padding: 12px 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .status-row {
      margin-bottom: 16px;
    }

    .status-pill {
      display: inline-flex;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: #ecfdf3;
      color: #027a48;
    }

    .status-pill.saving {
      background: #fff7d6;
      color: #8a5d00;
    }

    .saved {
      background: #ecfdf3;
      color: #027a48;
    }

    .section {
      background: #fff;
      border: 1px solid var(--color-border);
      border-radius: 18px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
    }

    .section-header {
      margin-bottom: 14px;
    }

    .section-title {
      margin: 0 0 4px;
      font-size: 18px;
      font-weight: 700;
    }

    .section-description {
      margin: 0;
      font-size: 13px;
      color: var(--color-muted);
      line-height: 1.5;
    }

    .stack {
      display: flex;
      flex-direction: column;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .gps-input,
    .gps-select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--color-border);
      border-radius: 10px;
      background: white;
      color: var(--color-text);
      font-size: 13px;
    }

    .gps-input:focus,
    .gps-select:focus {
      outline: none;
      border-color: var(--color-accent);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
    }

    .reap-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .reap-note {
      margin: 0;
      color: var(--color-muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 12px;
      padding: 12px 18px;
      border: 1px solid transparent;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-secondary {
      background: white;
      color: var(--color-text);
      border-color: var(--color-border);
    }

    .btn-full {
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./reap-mpa-settings.tsx"></script>
</body>
</html>
