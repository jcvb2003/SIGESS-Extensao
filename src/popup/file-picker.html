<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Selecionar PDF</title>
  <style>
    body { margin: 0; font-family: sans-serif; background: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; }
    .card { background: white; border-radius: 10px; padding: 32px 40px; box-shadow: 0 4px 20px rgba(0,0,0,0.12); text-align: center; max-width: 360px; }
    h2 { margin: 0 0 8px; color: #007bff; font-size: 18px; }
    p { color: #666; font-size: 13px; margin: 0 0 24px; }
    label { display: inline-flex; align-items: center; gap: 8px; background: #007bff; color: white; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; transition: background 0.2s; }
    label:hover { background: #0056b3; }
    .status { margin-top: 16px; font-size: 12px; color: #28a745; min-height: 18px; }
    .error { color: #dc3545; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./file-picker.tsx"></script>
</body>
</html>
