<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Selecionar PDF</title>
  <style>
    :root { color-scheme: light; --ink: #27343a; --muted: #647278; --line: #d5dcdf; --page: #f7f8f8; --accent: #176b68; --accent-dark: #0d514f; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 440px; min-height: 100vh; font-family: "Segoe UI", Tahoma, sans-serif; color: var(--ink); background: var(--page); }
    .file-picker-page { min-height: 100vh; display: grid; place-items: center; padding: 36px; }
    .file-picker-content { width: min(540px, 100%); padding: 0 0 24px; border-bottom: 1px solid var(--line); }
    h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
    p { max-width: 480px; margin: 9px 0 24px; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .file-action { display: flex; align-items: center; gap: 12px; }
    .file-action span { color: var(--muted); font-size: 11px; }
    .select-button { display: inline-flex; align-items: center; justify-content: center; min-height: 36px; padding: 0 14px; border: 1px solid var(--accent); color: white; background: var(--accent); cursor: pointer; font-size: 12px; font-weight: 600; transition: background .15s ease; }
    .select-button:hover, .select-button:focus-within { background: var(--accent-dark); }
    .select-button:active { background: var(--accent-dark); }
    .select-button input { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); }
    .status { min-height: 20px; margin-top: 12px; color: var(--accent); font-size: 12px; }
    .error { color: #a33a32; }
    @media (max-width: 560px) { body { min-width: 0; } .file-picker-page { padding: 24px 20px; } .file-action { align-items: flex-start; flex-direction: column; gap: 8px; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./file-picker.tsx"></script>
</body>
</html>
